name: CD — Deploy to Production

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Production Deployment Webhook
        run: |
          echo "==> Triggering production deployment hook..."
          curl -f -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
          echo "==> Production deployment successfully triggered!"
