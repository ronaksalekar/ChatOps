spring:
  config:
    activate:
      on-profile: test

  datasource:
    # Overridden by AbstractIntegrationTest using Testcontainers.
    url: jdbc:postgresql://localhost:5432/chatops_test
    username: chatops
    password: chatops

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  # Overridden by AbstractIntegrationTest using a Redis Testcontainer.
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-secret-key-that-is-at-least-64-characters-long-for-hs256-algorithm-tests
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    com.chatops: WARN
    root: WARN
