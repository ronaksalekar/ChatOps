spring:
  application:
    name: chatops

  # ===== DataSource =====
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatops}
    username: ${DB_USER:chatops}
    password: ${DB_PASSWORD:chatops_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ===== Flyway =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# ===== Server =====
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

# ===== JWT =====
app:
  jwt:
    secret: ${JWT_SECRET:chatops-super-secret-development-key-that-is-at-least-256-bits-long-for-hs256}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:3600000}       # 1 hour
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}   # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

---
# ===== DEV Profile =====
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

app:
  jwt:
    # Local-only fallback. Production has no fallback and must provide JWT_SECRET.
    secret: ${JWT_SECRET:local-dev-only-chatops-secret-change-before-deploy-0123456789abcdef}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

---
# ===== TEST Profile =====
spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false

---
# ===== PROD Profile =====
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.chatops: WARN
    root: WARN
