<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChatOps - Real-Time Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-chat: #0f172a;
      --bg-input: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --bubble-mine: #2563eb;
      --bubble-other: #1e293b;
      --system-msg: #64748b;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body {
      background: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      width: 100%;
    }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      padding: 16px;
    }
    .modal-card {
      background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: 12px;
      padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      max-height: 85vh; max-height: 85dvh; display: flex; flex-direction: column; overflow-y: auto;
    }
    .modal-card h3 { font-size: 18px; margin-bottom: 16px; }

    .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn {
      background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600;
      padding: 8px 16px; cursor: pointer; border-radius: 6px;
    }
    .tab-btn.active { color: var(--accent); background: rgba(59,130,246,0.1); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
    .form-group input {
      width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 16px; outline: none;
    }
    .form-group input:focus { border-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 16px; background: var(--accent); border: none; border-radius: 8px;
      color: white; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 14px;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: none; border: 1px solid var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 6px; }
    .btn-full { width: 100%; padding: 12px; }
    .auth-error { color: var(--danger); font-size: 13px; margin-top: 10px; text-align: center; display: none; }

    /* App Layout */
    #app {
      display: none;
      width: 100%;
      height: 100%;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }
    .sidebar {
      width: 290px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100%;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 { font-size: 18px; font-weight: 700; color: #fff; }
    .user-badge {
      display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); margin-top: 4px;
    }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .logout-btn {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px;
    }
    .logout-btn:hover { color: var(--danger); border-color: var(--danger); }

    .rooms-list { flex: 1; overflow-y: auto; padding: 12px; }
    .section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
      margin: 12px 0 8px 8px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;
    }
    .section-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text);
      cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: 600;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

    .room-item {
      padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
      display: flex; align-items: center; justify-content: space-between; color: var(--text-muted);
      font-size: 14px; font-weight: 500; transition: all 0.15s;
    }
    .room-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .room-item.active { background: var(--accent); color: white; }

    .empty-rooms {
      padding: 18px 12px; text-align: center; color: var(--text-muted); font-size: 13px;
      background: rgba(0,0,0,0.15); border-radius: 8px; margin-top: 8px;
    }
    .empty-rooms button { margin-top: 10px; width: 100%; }

    /* Explore / Join List */
    .explore-list { overflow-y: auto; margin: 12px 0; max-height: 340px; display: flex; flex-direction: column; gap: 8px; }
    .explore-item {
      padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .explore-info { min-width: 0; flex: 1; }
    .explore-info h4 { font-size: 14px; color: var(--text); font-weight: 600; }
    .explore-info p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .explore-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .joined-badge { font-size: 12px; color: var(--success); font-weight: 600; padding: 4px 8px; white-space: nowrap; }

    /* Main Chat Window */
    .chat-container {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-chat);
      height: 100%;
    }
    .chat-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15,23,42,0.9);
      gap: 10px;
      flex-shrink: 0;
    }
    .chat-header-info {
      min-width: 0;
      flex: 1;
    }
    .chat-header-info h3 {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-header-info p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }

    .mobile-menu-btn {
      display: none;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mobile-menu-btn:hover { background: var(--accent); color: white; }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(2px);
      z-index: 80;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .empty-state {
      margin: auto; text-align: center; color: var(--text-muted); font-size: 14px;
    }

    .msg { display: flex; flex-direction: column; max-width: 72%; word-break: break-word; }
    .msg.mine { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; align-items: flex-start; }
    .msg-header { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .msg-bubble {
      padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4;
    }
    .msg.mine .msg-bubble { background: var(--bubble-mine); color: white; border-bottom-right-radius: 2px; }
    .msg.other .msg-bubble { background: var(--bubble-other); color: var(--text); border-bottom-left-radius: 2px; border: 1px solid var(--border); }
    .msg.system {
      align-self: center; font-size: 12px; color: var(--system-msg); font-style: italic; margin: 6px 0; text-align: center;
    }

    /* Typing Bar */
    .typing-bar {
      height: 22px;
      padding: 0 20px;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      flex-shrink: 0;
    }

    /* Input Bar */
    .chat-input-bar {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      background: var(--bg-sidebar);
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; color: var(--text); font-size: 16px; outline: none;
    }
    .chat-input:focus { border-color: var(--accent); }
    .send-btn {
      background: var(--accent); border: none; border-radius: 8px; color: white;
      padding: 0 20px; font-weight: 600; cursor: pointer; transition: background 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--accent-hover); }

    /* ==============================================================
       Mobile Layout (< 768px)
       ============================================================== */
    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: inline-flex;
      }
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 82vw;
        max-width: 310px;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: none;
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.7);
      }
      .sidebar-backdrop.active {
        display: block;
      }
      .chat-header {
        padding: 10px 12px;
        gap: 8px;
      }
      .chat-header-info h3 {
        font-size: 15px;
      }
      .chat-header-info p {
        font-size: 11px;
      }
      .chat-header-actions {
        gap: 4px;
      }
      .chat-header-actions .btn-sm {
        padding: 5px 8px;
        font-size: 11px;
      }
      .messages-area {
        padding: 12px;
        gap: 10px;
      }
      .msg {
        max-width: 88%;
      }
      .msg-bubble {
        padding: 8px 12px;
        font-size: 14px;
      }
      .chat-input-bar {
        padding: 10px 12px;
        gap: 8px;
      }
      .chat-input {
        padding: 10px 12px;
        font-size: 16px; /* 16px prevents mobile browser zoom */
      }
      .send-btn {
        padding: 0 16px;
        font-size: 13px;
      }
      .modal-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Authentication Modal -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <div class="auth-tabs">
        <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">Sign In</button>
        <button class="tab-btn" id="tabRegister" onclick="switchAuthTab('register')">Register</button>
      </div>

      <div id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="alice">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <button class="btn btn-full" onclick="handleLogin()">Sign In</button>
      </div>

      <div id="registerForm" style="display:none;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="regUsername" placeholder="bob">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="bob@example.com">
        </div>
        <div class="form-group">
          <label>Password (min 8 chars, 1 uppercase, 1 digit, 1 special)</label>
          <input type="password" id="regPassword" placeholder="Password123!">
        </div>
        <button class="btn btn-full" onclick="handleRegister()">Create Account</button>
      </div>

      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div id="roomModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h3>Create New Channel</h3>
      <div class="form-group">
        <label>Channel Name</label>
        <input type="text" id="newRoomName" placeholder="engineering">
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="newRoomDesc" placeholder="Team discussions & tech talk">
      </div>
      <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
        <input type="checkbox" id="newRoomPrivate" style="width: auto; cursor: pointer;">
        <label for="newRoomPrivate" style="margin: 0; cursor: pointer; text-transform: none; font-size: 13px;">Make Private (Invite-only, hidden from Browse)</label>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="btn btn-secondary" style="flex:1" onclick="closeRoomModal()">Cancel</button>
        <button class="btn" style="flex:1" onclick="handleCreateRoom()">Create</button>
      </div>
    </div>
  </div>

  <!-- Explore / Join Channels Modal -->
  <div id="exploreModal" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width: 520px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Explore & Join Channels</h3>
        <button class="icon-btn" onclick="closeExploreModal()">✕</button>
      </div>

      <p style="font-size: 13px; color: var(--text-muted); margin: 6px 0 12px;">
        Browse public channels or enter an invite code:
      </p>

      <!-- Invite Code / Direct ID Join -->
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input type="text" id="directJoinInput" class="chat-input" placeholder="Invite Code (e.g. a3f8c12b) or ID..." style="padding: 8px 12px; font-size: 14px;">
        <button class="btn btn-sm btn-success" onclick="joinByCodeOrId()">Join</button>
      </div>

      <div class="section-title" style="margin-left: 0;">Public Channels</div>
      <div id="exploreContainer" class="explore-list">
        <div style="text-align: center; color: var(--text-muted); padding: 20px;">Loading public channels...</div>
      </div>

      <div style="margin-top: 12px; text-align: right;">
        <button class="btn btn-secondary btn-sm" onclick="closeExploreModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Main Chat Application -->
  <div id="app">
    <!-- Backdrop for mobile drawer -->
    <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div>
          <h2>ChatOps</h2>
          <div class="user-badge">
            <span class="user-dot"></span>
            <span id="currentUsername">user</span>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="rooms-list">
        <div class="section-title">
          <span>My Channels</span>
          <div class="section-actions">
            <button class="icon-btn" title="Explore & Join Channels" onclick="openExploreModal()">🔍 Join</button>
            <button class="icon-btn" title="Create New Channel" onclick="openRoomModal()">+ New</button>
          </div>
        </div>
        <div id="roomsContainer"></div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container">
      <div class="chat-header">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" title="Channels">☰</button>
        <div class="chat-header-info">
          <h3 id="roomTitle">Select a room</h3>
          <p id="roomDesc"></p>
        </div>
        <div class="chat-header-actions" id="roomActions" style="display:none;">
          <button class="btn btn-secondary btn-sm" id="copyInviteBtn" onclick="copyInviteCode()" title="Copy Invite Code">📋 Code</button>
          <button class="btn btn-secondary btn-sm" id="inviteUserBtn" onclick="openInviteUserPrompt()">+ Invite</button>
          <button class="btn btn-secondary btn-sm" onclick="handleLeaveRoom()">Leave</button>
          <button class="btn btn-danger btn-sm" id="deleteBtn" style="display:none;" onclick="handleDeleteRoom()">Delete</button>
        </div>
      </div>

      <div class="messages-area" id="messagesArea">
        <div class="empty-state">Select a channel on the left to start chatting</div>
      </div>

      <div class="typing-bar" id="typingIndicator"></div>

      <div class="chat-input-bar">
        <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." disabled>
        <button id="sendBtn" class="send-btn" onclick="sendMessage()" disabled>Send</button>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('chatops_token');
    let currentUser = JSON.parse(localStorage.getItem('chatops_user') || '{}');
    let currentRoom = null;
    let myRooms = [];
    let stompClient = null;
    let currentSubscriptions = [];
    let subscribedRoomId = null;
    let typingTimeout = null;

    window.addEventListener('load', () => {
      if (token && currentUser.username) {
        showApp();
      } else {
        showAuth();
      }

      const input = document.getElementById('messageInput');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
        else sendTyping();
      });
    });

    /* Mobile Sidebar Controls */
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      const isOpen = sidebar.classList.toggle('open');
      backdrop.classList.toggle('active', isOpen);
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (sidebar) sidebar.classList.remove('open');
      if (backdrop) backdrop.classList.remove('active');
    }

    function switchAuthTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      hideAuthError();
    }

    function showAuthError(msg) {
      const err = document.getElementById('authError');
      err.textContent = msg;
      err.style.display = 'block';
    }

    function hideAuthError() {
      document.getElementById('authError').style.display = 'none';
    }

    async function handleLogin() {
      hideAuthError();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!username || !password) return showAuthError('Please fill in all fields');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Invalid username or password');
        }
        const data = await res.json();
        token = data.accessToken;
        currentUser = { username: data.username, id: data.userId };
        localStorage.setItem('chatops_token', token);
        localStorage.setItem('chatops_user', JSON.stringify(currentUser));
        showApp();
      } catch (e) {
        showAuthError(e.message);
      }
    }

    async function handleRegister() {
      hideAuthError();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      if (!username || !email || !password) return showAuthError('Please fill in all fields');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Registration failed');
        }
        const data = await res.json();
        token = data.accessToken;
        currentUser = { username: data.username, id: data.userId };
        localStorage.setItem('chatops_token', token);
        localStorage.setItem('chatops_user', JSON.stringify(currentUser));
        showApp();
      } catch (e) {
        showAuthError(e.message);
      }
    }

    function logout() {
      localStorage.removeItem('chatops_token');
      localStorage.removeItem('chatops_user');
      token = null;
      currentUser = {};
      unsubscribeFromRoom();
      if (stompClient) {
        try { stompClient.disconnect(); } catch (e) {}
        stompClient = null;
      }
      location.reload();
    }

    function showAuth() {
      document.getElementById('authModal').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }

    function showApp() {
      document.getElementById('authModal').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('currentUsername').textContent = currentUser.username;
      connectWebSocket();
      loadRooms();
    }

    function connectWebSocket() {
      if (stompClient && stompClient.connected) return;
      const socket = new SockJS('/ws');
      stompClient = Stomp.over(socket);
      stompClient.debug = null;
      stompClient.connect({ Authorization: 'Bearer ' + token }, (frame) => {
        if (currentRoom) {
          subscribeToRoom(currentRoom.id);
        }
      }, (err) => {
        console.error('STOMP error:', err);
      });
    }

    async function loadRooms() {
      try {
        const res = await fetch('/api/rooms', {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('Failed to load rooms');
        myRooms = await res.json();
        const container = document.getElementById('roomsContainer');
        container.innerHTML = '';

        if (myRooms.length === 0) {
          container.innerHTML = `
            <div class="empty-rooms">
              You haven't joined any channels yet.
              <button class="btn btn-sm btn-success" onclick="openExploreModal()">🔍 Browse Channels</button>
            </div>
          `;
          document.getElementById('roomActions').style.display = 'none';
          document.getElementById('roomTitle').textContent = 'No channels joined';
          document.getElementById('roomDesc').textContent = 'Click "Browse Channels" to find and join a channel.';
          document.getElementById('messagesArea').innerHTML = '<div class="empty-state">Browse and join a channel to start messaging</div>';
          document.getElementById('messageInput').disabled = true;
          document.getElementById('sendBtn').disabled = true;
          return;
        }

        myRooms.forEach(r => {
          const div = document.createElement('div');
          div.className = 'room-item' + (currentRoom && currentRoom.id === r.id ? ' active' : '');
          div.innerHTML = `<span>${r.isPrivate ? '🔒' : '#'} ${escapeHtml(r.name)}</span>`;
          div.onclick = () => selectRoom(r);
          container.appendChild(div);
        });

        if (currentRoom && myRooms.some(r => r.id === currentRoom.id)) {
          selectRoom(myRooms.find(r => r.id === currentRoom.id));
        } else if (myRooms.length > 0) {
          selectRoom(myRooms[0]);
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function selectRoom(room) {
      if (!room) return;
      currentRoom = room;

      closeSidebar();

      document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
      const items = Array.from(document.querySelectorAll('.room-item'));
      const activeItem = items.find(el => el.textContent.includes(room.name));
      if (activeItem) activeItem.classList.add('active');

      document.getElementById('roomTitle').textContent = (room.isPrivate ? '🔒 ' : '# ') + room.name;
      document.getElementById('roomDesc').textContent = (room.description || 'No description') + ` (${room.memberCount || 1} members)`;
      document.getElementById('roomActions').style.display = 'flex';
      const deleteBtn = document.getElementById('deleteBtn');
      if (deleteBtn) {
        deleteBtn.style.display = (room.createdByUsername === currentUser.username) ? 'inline-flex' : 'none';
      }
      document.getElementById('messageInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('messageInput').focus();

      unsubscribeFromRoom();
      await loadMessages(room.id);

      if (stompClient && stompClient.connected) {
        subscribeToRoom(room.id);
      }
    }

    function unsubscribeFromRoom() {
      if (currentSubscriptions && currentSubscriptions.length > 0) {
        currentSubscriptions.forEach(sub => {
          try {
            if (sub && typeof sub.unsubscribe === 'function') {
              sub.unsubscribe();
            }
          } catch (e) {
            console.warn('Error unsubscribing:', e);
          }
        });
        currentSubscriptions = [];
      }
      subscribedRoomId = null;
    }

    function subscribeToRoom(roomId) {
      if (!stompClient || !stompClient.connected) return;
      if (subscribedRoomId === roomId && currentSubscriptions.length > 0) {
        return; // Already subscribed to this room, avoid duplicating
      }

      unsubscribeFromRoom();

      const msgSub = stompClient.subscribe('/topic/rooms/' + roomId, (msg) => {
        try {
          const data = JSON.parse(msg.body);
          appendMessage(data);
        } catch (e) {
          console.error('Failed to parse STOMP message:', e);
        }
      });

      const typeSub = stompClient.subscribe('/topic/rooms/' + roomId + '/typing', (msg) => {
        try {
          const data = JSON.parse(msg.body);
          if (data.username !== currentUser.username) {
            showTypingIndicator(data.username);
          }
        } catch (e) {
          console.error('Failed to parse typing payload:', e);
        }
      });

      currentSubscriptions.push(msgSub, typeSub);
      subscribedRoomId = roomId;
    }

    async function loadMessages(roomId) {
      const area = document.getElementById('messagesArea');
      area.innerHTML = '';
      try {
        const res = await fetch(`/api/rooms/${roomId}/messages?limit=50`, {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!res.ok) return;
        const page = await res.json();
        const msgs = (page.messages || []).slice().reverse();
        if (msgs.length === 0) {
          area.innerHTML = '<div class="empty-state">No messages yet. Say hello! 👋</div>';
        } else {
          msgs.forEach(m => appendMessage(m, false));
        }
        scrollToBottom();
      } catch (e) {
        console.error(e);
      }
    }

    function appendMessage(m, scroll = true) {
      if (!m) return;
      const area = document.getElementById('messagesArea');
      if (area.querySelector('.empty-state')) area.innerHTML = '';

      // Message Deduplication
      const msgKey = m.id ? 'msg-' + m.id : (m.cursorId ? 'msg-cur-' + m.cursorId : null);
      if (msgKey && document.getElementById(msgKey)) {
        return; // Message already rendered in DOM, ignore duplicate
      }

      const isMine = m.senderUsername === currentUser.username;
      const isSystem = m.messageType === 'SYSTEM' || m.messageType === 'JOIN' || m.messageType === 'LEAVE';

      const div = document.createElement('div');
      if (msgKey) div.id = msgKey;

      if (isSystem) {
        div.className = 'msg system';
        div.textContent = m.content;
      } else {
        div.className = 'msg ' + (isMine ? 'mine' : 'other');
        const time = m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        div.innerHTML = `
          <div class="msg-header">${isMine ? 'You' : escapeHtml(m.senderUsername)} • ${time}</div>
          <div class="msg-bubble">${escapeHtml(m.content)}</div>
        `;
      }
      area.appendChild(div);
      if (scroll) scrollToBottom();
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentRoom || !stompClient || !stompClient.connected) return;

      stompClient.send('/app/rooms/' + currentRoom.id + '/send', {}, JSON.stringify({ content: text }));
      input.value = '';
    }

    function sendTyping() {
      if (!currentRoom || !stompClient || !stompClient.connected) return;
      stompClient.send('/app/rooms/' + currentRoom.id + '/typing', {}, JSON.stringify({}));
    }

    function showTypingIndicator(username) {
      const el = document.getElementById('typingIndicator');
      el.textContent = `${username} is typing...`;
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { el.textContent = ''; }, 2500);
    }

    function scrollToBottom() {
      const area = document.getElementById('messagesArea');
      area.scrollTop = area.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Modal: Explore & Join
    async function openExploreModal() {
      document.getElementById('exploreModal').style.display = 'flex';
      const container = document.getElementById('exploreContainer');
      container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Loading public channels...</div>';

      try {
        const res = await fetch('/api/rooms/public', {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('Failed to load public channels');
        const publicRooms = await res.json();

        container.innerHTML = '';
        if (publicRooms.length === 0) {
          container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">No public channels found. Create one!</div>';
          return;
        }

        const myRoomIds = new Set(myRooms.map(r => r.id));

        publicRooms.forEach(room => {
          const isMember = myRoomIds.has(room.id);
          const div = document.createElement('div');
          div.className = 'explore-item';
          div.innerHTML = `
            <div class="explore-info">
              <h4># ${escapeHtml(room.name)}</h4>
              <p>${escapeHtml(room.description || 'No description')}</p>
              <div class="explore-meta">${room.memberCount || 1} members • Code: <code>${room.inviteCode || room.id}</code></div>
            </div>
            <div>
              ${isMember 
                ? `<span class="joined-badge">✓ Joined</span>`
                : `<button class="btn btn-sm btn-success" onclick="joinRoom(${room.id})">Join</button>`
              }
            </div>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        container.innerHTML = `<div style="text-align:center;color:var(--danger);padding:20px;">${escapeHtml(e.message)}</div>`;
      }
    }

    function closeExploreModal() {
      document.getElementById('exploreModal').style.display = 'none';
      const input = document.getElementById('directJoinInput');
      if (input) input.value = '';
    }

    async function joinRoom(roomId) {
      try {
        const res = await fetch(`/api/rooms/${roomId}/join`, {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || err.message || 'Failed to join channel');
        }
        closeExploreModal();
        await loadRooms();
        const target = myRooms.find(r => r.id === roomId);
        if (target) selectRoom(target);
      } catch (e) {
        alert(e.message);
      }
    }

    async function joinByCodeOrId() {
      const input = document.getElementById('directJoinInput').value.trim();
      if (!input) return alert('Please enter an invite code or channel ID');

      try {
        const res = await fetch('/api/rooms/join', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify({ inviteCode: input })
        });
        if (res.ok) {
          const room = await res.json();
          closeExploreModal();
          await loadRooms();
          selectRoom(room);
          return;
        }

        if (/^\d+$/.test(input)) {
          await joinRoom(parseInt(input));
          return;
        }

        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || err.message || 'Invalid invite code or channel ID');
      } catch (e) {
        alert(e.message);
      }
    }

    function copyInviteCode() {
      if (!currentRoom || !currentRoom.inviteCode) return alert('No invite code available');
      navigator.clipboard.writeText(currentRoom.inviteCode).then(() => {
        const btn = document.getElementById('copyInviteBtn');
        const oldText = btn.textContent;
        btn.textContent = '✓ Copied!';
        setTimeout(() => { btn.textContent = oldText; }, 2000);
      }).catch(() => {
        prompt('Channel Invite Code (Ctrl+C to copy):', currentRoom.inviteCode);
      });
    }

    async function openInviteUserPrompt() {
      if (!currentRoom) return;
      const username = prompt(`Invite user to #${currentRoom.name}:\nEnter username:`);
      if (!username || !username.trim()) return;

      try {
        const res = await fetch(`/api/rooms/${currentRoom.id}/invite`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify({ username: username.trim() })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || err.message || 'Failed to invite user');
        }
        alert(`Successfully invited ${username} to #${currentRoom.name}!`);
        await loadRooms();
      } catch (e) {
        alert(e.message);
      }
    }

    async function handleLeaveRoom() {
      if (!currentRoom) return;
      if (!confirm(`Are you sure you want to leave #${currentRoom.name}?`)) return;

      try {
        const res = await fetch(`/api/rooms/${currentRoom.id}/leave`, {
          method: 'DELETE',
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || err.message || 'Failed to leave channel');
        }
        currentRoom = null;
        await loadRooms();
      } catch (e) {
        alert(e.message);
      }
    }

    async function handleDeleteRoom() {
      if (!currentRoom) return;
      if (!confirm(`Are you sure you want to DELETE #${currentRoom.name}? This will remove all messages and members.`)) return;

      try {
        const res = await fetch(`/api/rooms/${currentRoom.id}`, {
          method: 'DELETE',
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || err.message || 'Failed to delete channel');
        }
        currentRoom = null;
        await loadRooms();
      } catch (e) {
        alert(e.message);
      }
    }

    // Modal: Create Room
    function openRoomModal() {
      document.getElementById('roomModal').style.display = 'flex';
      document.getElementById('newRoomName').focus();
    }
    function closeRoomModal() {
      document.getElementById('roomModal').style.display = 'none';
      document.getElementById('newRoomName').value = '';
      document.getElementById('newRoomDesc').value = '';
      document.getElementById('newRoomPrivate').checked = false;
    }
    async function handleCreateRoom() {
      const name = document.getElementById('newRoomName').value.trim();
      const description = document.getElementById('newRoomDesc').value.trim();
      const isPrivate = document.getElementById('newRoomPrivate').checked;
      if (!name) return alert('Room name is required');

      try {
        const res = await fetch('/api/rooms', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify({ name, description, isPrivate })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || err.message || 'Failed to create room');
        }
        const room = await res.json();
        closeRoomModal();
        await loadRooms();
        selectRoom(room);
      } catch (e) {
        alert(e.message);
      }
    }
  </script>
</body>
</html>
